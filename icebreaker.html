<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{
  --bg:radial-gradient(ellipse 70% 60% at 20% 80%,color-mix(in srgb,#1a4a5a 38%,#0D1620) 0%,transparent 65%),radial-gradient(ellipse 60% 50% at 80% 20%,color-mix(in srgb,#2a5568 32%,#0D1620) 0%,transparent 60%),radial-gradient(ellipse 80% 70% at 50% 30%,color-mix(in srgb,#4FB0C8 7%,#0D1620) 0%,transparent 55%),#0D1620;--surface:#15222E;
  --ink:#E8EEF2;--ink-2:#BCD4DE;--ink-3:#8AA6B3;--ink-4:#5E7B89;
  --line:rgba(188,212,222,.1);--line-soft:rgba(188,212,222,.05);
  --accent:#6AB3C9;--accent-hover:#88C9DD;--accent-wash:rgba(106,179,201,.08);
  --topbar-bg:rgba(13,22,32,.85);--live:#5FD4C2;
  --royal:#4FB0C8;
  --card-bg:var(--surface);--card-ink:var(--ink);--card-sub:var(--ink-4);
  --card-border:var(--line);--card-soft:var(--line-soft);
  --card-hover:var(--accent-wash);--card-hover-ink:var(--accent);
  --ease:cubic-bezier(.25,.46,.45,.94);
}
html{font-size:var(--base-size,16.5px);-webkit-font-smoothing:antialiased}
body{background:var(--bg);background-attachment:fixed;color:var(--ink);font-family:var(--font-ui,'Inter'),-apple-system,sans-serif;min-height:100vh;display:flex;flex-direction:column;transition:background .35s var(--ease),color .35s var(--ease);overflow-x:hidden}
body::after{content:'';position:fixed;inset:0;pointer-events:none;z-index:9999;background-image:url("data:image/svg+xml,%3Csvg viewBox='0 0 512 512' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.85' numOctaves='3' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)' opacity='1'/%3E%3C/svg%3E");opacity:.02}

/* TOPBAR */
.topbar{height:56px;display:grid;grid-template-columns:1fr auto 1fr;align-items:center;padding:0 2rem;background:var(--topbar-bg);backdrop-filter:saturate(180%) blur(16px);-webkit-backdrop-filter:saturate(180%) blur(16px);border-bottom:1px solid var(--line);position:sticky;top:0;z-index:100;animation:fadeIn .25s var(--ease) .02s both}
.tb-left,.tb-right{display:flex;align-items:center;gap:10px}
.tb-right{justify-content:flex-end}
.pill{display:inline-flex;align-items:center;gap:6px;font-size:.7rem;font-weight:500;padding:6px 13px;border-radius:999px;text-decoration:none;cursor:pointer;border:none;white-space:nowrap;transition:background .12s var(--ease),color .12s,transform .1s,border-color .12s;font-family:inherit}
.pill-ghost{background:transparent;color:var(--ink-2);border:1px solid var(--line)}
.pill-ghost:hover{background:var(--surface);border-color:var(--ink-4);transform:translateY(-1px)}
.pill-solid{background:var(--accent);color:var(--bg)}
.pill-solid:hover{background:var(--accent-hover);transform:translateY(-1px)}
.pill-outline{background:transparent;color:var(--ink-2);border:1px solid var(--ink-4)}
.pill-accent{background:var(--accent-wash);color:var(--accent-hover);border:1px solid color-mix(in srgb,var(--accent) 40%,transparent)}
.pill-accent:hover{background:color-mix(in srgb,var(--accent) 16%,transparent);border-color:var(--accent);transform:translateY(-1px)}
.pill-outline:hover{background:var(--surface);transform:translateY(-1px)}
.tb-date{font-size:.68rem;letter-spacing:.06em;color:var(--ink-3);display:flex;align-items:center;gap:8px}
.live{width:6px;height:6px;border-radius:50%;background:var(--live);box-shadow:0 0 0 3px color-mix(in srgb,var(--live) 20%,transparent);animation:breathe 2.4s ease-in-out infinite;flex-shrink:0}
@keyframes breathe{0%,100%{opacity:1;transform:scale(1)}50%{opacity:.6;transform:scale(.85)}}
@keyframes fadeIn{from{opacity:0}to{opacity:1}}
@keyframes heroIn{from{opacity:0;transform:translateY(20px)}to{opacity:1;transform:translateY(0)}}

/* HERO */
.hero{padding:3rem 2rem 1.5rem;text-align:center;animation:heroIn .45s var(--ease) .06s both}
.hero-title{font-family:var(--font-display,'Fraunces'),Georgia,serif;font-weight:var(--display-weight,300);font-size:clamp(2.4rem,5vw,4rem);line-height:.95;letter-spacing:-.025em;color:var(--ink)}
.hero-title em{font-style:italic;font-weight:var(--display-weight,300);background:linear-gradient(100deg,var(--ink-3) 0%,var(--accent-hover) 45%,var(--accent) 70%,var(--ink-3) 100%);background-size:220% 100%;-webkit-background-clip:text;background-clip:text;color:transparent}
.hero-rule{width:32px;height:1px;background:var(--ink-4);margin:1.6rem auto 0}

/* GRID */
.grid{display:grid;grid-template-columns:1fr 1fr;max-width:940px;margin:0 auto;width:100%;padding:1.5rem 2rem 4.5rem;gap:0;animation:fadeIn .35s var(--ease) .2s both}
.col{padding:0 3rem}
.col:first-child{border-right:1px solid var(--line);padding-left:0}
.col:last-child{padding-right:0}
.col-heading{font-size:.64rem;font-weight:600;letter-spacing:.2em;text-transform:uppercase;color:var(--ink-3);text-align:center;margin-bottom:1.6rem;padding-bottom:.9rem;border-bottom:1px solid var(--line)}
.group-label{font-size:.54rem;font-weight:600;letter-spacing:.22em;text-transform:uppercase;color:var(--ink-4);margin:1.6rem 0 .65rem .15rem}

/* GROUP */
.group{background:var(--card-bg);border:1px solid var(--card-border);border-radius:14px;overflow:hidden;margin-bottom:1rem;box-shadow:0 1px 2px rgba(0,0,0,.15);transition:background .25s var(--ease),border-color .25s var(--ease),box-shadow .25s var(--ease)}
.row{display:flex;align-items:center;gap:12px;width:100%;padding:1.05rem 1.15rem;border:none;background:transparent;border-bottom:1px solid var(--card-soft);cursor:pointer;text-align:left;transition:background .13s var(--ease),padding-left .15s var(--ease);color:var(--card-ink);text-decoration:none;font-family:inherit}
.group .row:last-child{border-bottom:none}
.row:hover{background:var(--card-hover);padding-left:1.45rem}
.row:hover .r-arrow{opacity:1;transform:translateX(2px);color:var(--card-hover-ink)}
.row:hover .r-name{color:var(--card-hover-ink)}
.r-dot{width:5px;height:5px;border-radius:50%;background:var(--card-sub);flex-shrink:0;opacity:.55;transition:opacity .2s,background .2s}
.row:hover .r-dot{opacity:1;background:var(--card-hover-ink)}
.r-text{flex:1;display:flex;flex-direction:column;gap:3px;min-width:0}
.r-name{font-size:.95rem;font-weight:500;color:var(--card-ink);letter-spacing:-.01em;transition:color .18s;line-height:1}
.r-sub{font-size:.62rem;letter-spacing:.09em;color:var(--card-sub);font-weight:400;text-transform:uppercase}
.r-arrow{display:inline-flex;color:var(--card-sub);opacity:0;transition:opacity .2s,transform .22s var(--ease),color .2s}
.r-arrow svg{width:13px;height:13px;display:block}
.row-thin{padding:.55rem 1.15rem 0.55rem calc(1.15rem - 2px);border-left:2px solid rgba(232,160,32,.4);background:rgba(232,160,32,.04)}
.row-thin:hover{background:rgba(232,160,32,.09);padding-left:calc(1.45rem - 2px)}
.row-thin .r-name{font-size:.78rem;color:#e0ac4a}
.row-thin:hover .r-name{color:#f0c06a}
.row-thin .r-sub{font-size:.56rem}
.row-thin .r-dot{width:4px;height:4px;background:#e0ac4a;opacity:.7}
.row-thin:hover .r-dot{background:#f0c06a;opacity:1}
.row-thin .r-arrow{color:#e0ac4a}
.row-thin:hover .r-arrow{color:#f0c06a}
.row{opacity:0;animation:rowIn .3s var(--ease) forwards}
@keyframes rowIn{from{opacity:0;transform:translateY(5px)}to{opacity:1;transform:translateY(0)}}
.group .row:nth-child(1){animation-delay:.28s}
.group .row:nth-child(2){animation-delay:.31s}
.group .row:nth-child(3){animation-delay:.34s}
.group .row:nth-child(4){animation-delay:.37s}
.group .row:nth-child(5){animation-delay:.4s}
.group .row:nth-child(6){animation-delay:.43s}

/* MODAL — royal glass */
.overlay{display:none;position:fixed;inset:0;z-index:500;background:radial-gradient(ellipse at top,color-mix(in srgb,var(--royal) 35%,transparent) 0%,rgba(5,10,16,.72) 60%);backdrop-filter:blur(12px) saturate(160%);-webkit-backdrop-filter:blur(12px) saturate(160%);align-items:center;justify-content:center;opacity:0;pointer-events:none;transition:opacity 0s}
.overlay.open{display:flex;opacity:1;pointer-events:auto}
.modal{width:min(460px,92vw);position:relative;background:linear-gradient(145deg,color-mix(in srgb,var(--royal) 22%,rgba(255,255,255,.08)),color-mix(in srgb,var(--royal) 6%,rgba(255,255,255,.02)));border:1px solid color-mix(in srgb,var(--royal) 35%,rgba(255,255,255,.18));border-radius:20px;padding:2.4rem 2.2rem 1.9rem;backdrop-filter:blur(30px) saturate(180%);-webkit-backdrop-filter:blur(30px) saturate(180%);box-shadow:0 40px 100px rgba(0,0,0,.5),0 0 0 1px color-mix(in srgb,var(--royal) 18%,transparent) inset,0 1px 0 rgba(255,255,255,.12) inset,0 0 60px color-mix(in srgb,var(--royal) 14%,transparent);transform:scale(.94) translateY(10px);opacity:0;transition:transform .26s cubic-bezier(.2,.8,.2,1),opacity .2s var(--ease);overflow:hidden}
.overlay.open .modal{transform:scale(1) translateY(0);opacity:1}
.modal::before{content:'';position:absolute;inset:0;border-radius:20px;pointer-events:none;background:radial-gradient(ellipse 80% 50% at 50% -10%,color-mix(in srgb,var(--royal) 50%,transparent),transparent 70%);mix-blend-mode:screen;opacity:.7}
.modal-close{position:absolute;top:1rem;right:1.1rem;z-index:2;width:26px;height:26px;border-radius:50%;background:rgba(255,255,255,.06);border:none;color:var(--ink-2);cursor:pointer;font-size:.75rem;display:flex;align-items:center;justify-content:center;transition:background .15s}
.modal-close:hover{background:rgba(255,255,255,.14)}
.modal-eyebrow{font-size:.55rem;letter-spacing:.22em;text-transform:uppercase;color:var(--royal);margin-bottom:6px;font-weight:600;position:relative;z-index:1}
.modal-title{font-family:var(--font-display,'Fraunces'),Georgia,serif;font-weight:var(--display-weight,300);font-size:1.7rem;letter-spacing:-.01em;color:var(--ink);margin-bottom:1.4rem;position:relative;z-index:1}
.modal-list{display:flex;flex-direction:column;gap:6px;position:relative;z-index:1}
.mi{display:flex;align-items:center;justify-content:space-between;padding:.8rem 1.05rem;border:1px solid color-mix(in srgb,var(--royal) 20%,rgba(255,255,255,.1));border-radius:11px;cursor:pointer;text-decoration:none;background:color-mix(in srgb,var(--royal) 6%,rgba(255,255,255,.03));color:var(--ink);font-family:inherit;transition:background .2s var(--ease),border-color .2s,transform .2s;opacity:0;transform:translateY(4px);animation:miIn .2s var(--ease) forwards}
@keyframes miIn{to{opacity:1;transform:translateY(0)}}
.mi:hover{background:color-mix(in srgb,var(--royal) 22%,rgba(255,255,255,.05));border-color:color-mix(in srgb,var(--royal) 55%,transparent);transform:translateY(-1px)}
.mi:hover .mi-name{color:color-mix(in srgb,var(--royal) 80%,var(--ink))}
.mi-name{font-size:.82rem;font-weight:500;transition:color .15s}
.mi-arrow{display:inline-flex;color:var(--ink-4)}
.mi-arrow svg{width:12px;height:12px;display:block}

/* IFRAME VIEWER */
.iframe-overlay{display:none;position:fixed;inset:0;z-index:600;flex-direction:column;background:var(--bg)}
.iframe-overlay.open{display:flex}
.iframe-topbar{height:48px;display:flex;align-items:center;justify-content:space-between;padding:0 1.4rem;background:#061221;flex-shrink:0}
.iframe-back{display:flex;align-items:center;gap:7px;color:rgba(255,255,255,.85);font-size:.72rem;font-weight:500;letter-spacing:.05em;background:rgba(255,255,255,.12);border:none;border-radius:8px;padding:5px 13px;cursor:pointer;transition:background .2s;font-family:inherit}
.iframe-back:hover{background:rgba(255,255,255,.22)}
.iframe-title{font-size:.75rem;font-weight:600;letter-spacing:.08em;color:rgba(255,255,255,.9);text-transform:uppercase}
.iframe-open-ext{display:flex;align-items:center;gap:5px;color:rgba(255,255,255,.6);font-size:.65rem;text-decoration:none;letter-spacing:.04em;transition:color .2s}
.iframe-open-ext:hover{color:#fff}
.iframe-frame{flex:1;border:none;width:100%}

</style>
</head>

<!-- Password Gate -->
<div id="gate" style="position:fixed;inset:0;z-index:9998;background:radial-gradient(ellipse 70% 60% at 20% 80%,rgba(26,74,90,.5) 0%,transparent 65%),radial-gradient(ellipse 60% 50% at 80% 20%,rgba(42,85,104,.45) 0%,transparent 60%),radial-gradient(ellipse 80% 70% at 50% 30%,rgba(79,176,200,.1) 0%,transparent 55%),#0D1620;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:1.4rem;">
  <div id="gate-title" style="font-family:'Fraunces',Georgia,serif;font-size:2rem;font-weight:300;color:#E8EEF2;letter-spacing:-.025em;display:inline-block;">Hard<em style="font-style:italic;color:#8AA6B3;">Miner</em></div>
  <div style="font-size:.58rem;font-weight:600;letter-spacing:.22em;text-transform:uppercase;color:#5E7B89;">Internal Access Only</div>
  <div style="display:flex;flex-direction:column;gap:.6rem;width:min(320px,88vw)">
    <input id="gate-input" type="password" placeholder="Enter password"
      style="width:100%;padding:.85rem 1.1rem;border:1px solid rgba(188,212,222,.18);border-radius:10px;background:#15222E;font-size:.9rem;color:#E8EEF2;outline:none;transition:border-color .2s;font-family:-apple-system,'Helvetica Neue',sans-serif;"
      onfocus="this.style.borderColor='#6AB3C9'" onblur="this.style.borderColor='rgba(188,212,222,.18)'"
      onkeydown="if(event.key==='Enter')checkPass()"/>
    <button onclick="checkPass()" style="width:100%;padding:.85rem;border:none;border-radius:10px;background:#6AB3C9;color:#0D1620;font-size:.82rem;font-weight:600;letter-spacing:.04em;cursor:pointer;transition:background .2s;font-family:-apple-system,'Helvetica Neue',sans-serif;"
      onmouseover="this.style.background='#88C9DD'" onmouseout="this.style.background='#6AB3C9'">Enter</button>
    <div id="gate-err" style="font-size:.68rem;color:#6AB3C9;text-align:center;min-height:1em;letter-spacing:.04em;"></div>
  </div>
</div>
<script>
(function(){if(sessionStorage.getItem('hm_auth')==='1'){document.getElementById('gate').style.display='none';}})();
function checkPass(){
  var v=document.getElementById('gate-input').value;
  if(v==='852046'){
    sessionStorage.setItem('hm_auth','1');
    document.getElementById('gate').style.display='none';
  } else {
    document.getElementById('gate-err').textContent='Incorrect password. Try again.';
    document.getElementById('gate-input').value='';
    document.getElementById('gate-input').focus();
  }
}
</script>

const EYEBROW = {fundamentals:'Fundamentals','non-fundamentals':'Non-Fundamentals',tradeflows:'Trade Data',weather:'Weather'};

const ICON_ARROW = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M4 12h14M13 6l6 6-6 6"/></svg>';
const ICON_EXTERNAL = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M7 17L17 7M9 7h8v8"/></svg>';
const ICON_PLAY = '<svg viewBox="0 0 24 24" fill="currentColor"><path d="M7 4l13 8-13 8z"/></svg>';

function openModal(name, type) {
  document.getElementById('m-eyebrow').textContent = EYEBROW[type] || 'Open';
  document.getElementById('m-title').textContent = name;
  const list = document.getElementById('m-list');
  list.innerHTML = '';
  const sections = (LINKS[type] && LINKS[type][name]) || {};
  Object.entries(sections).forEach(([label, url], i) => {
    const isSoon = !url || url === 'coming-soon.html';
    if (isSoon) return;
    const a = document.createElement('a');
    a.className = 'mi';
    a.style.animationDelay = '0ms';
    const isIframe = url && url.startsWith('iframe:');
    const isPopup = url && url.startsWith('popup:');
    const isExternal = !isIframe && !isPopup && url && url.startsWith('http');
    if (isIframe) {
      const parts = url.split(':');
      const iTitle = parts[1];
      const iUrl = parts.slice(2).join(':');
      a.href = '#';
      a.innerHTML = `<span class="mi-name">${label}</span><span class="mi-arrow">${ICON_PLAY}</span>`;
      a.addEventListener('click', e => { e.preventDefault(); openIframe(iTitle, iUrl); });
    } else if (isPopup) {
      const pUrl = url.slice(6);
      a.href = '#';
      a.innerHTML = `<span class="mi-name">${label}</span><span class="mi-arrow">${ICON_EXTERNAL}</span>`;
      a.addEventListener('click', e => { e.preventDefault(); window.open(pUrl, '_blank'); });
    } else {
      a.href = url || '#';
      if (isExternal) { a.target = '_blank'; a.rel = 'noopener'; }
      a.innerHTML = `<span class="mi-name">${label}</span><span class="mi-arrow">${isExternal ? ICON_EXTERNAL : ICON_ARROW}</span>`;
    }
    list.appendChild(a);
  });
  document.getElementById('overlay').classList.add('open');
  document.body.style.overflow = 'hidden';
}

function closeModal() {
  document.getElementById('overlay').classList.remove('open');
  document.body.style.overflow = '';
}

function openIframe(title, url) {
  document.getElementById('iframe-title').textContent = title;
  document.getElementById('iframe-frame').src = url;
  document.getElementById('iframe-ext-link').href = url;
  document.getElementById('iframe-overlay').classList.add('open');
  document.body.style.overflow = 'hidden';
  closeModal();
}

function closeIframe() {
  document.getElementById('iframe-overlay').classList.remove('open');
  document.getElementById('iframe-frame').src = '';
  document.body.style.overflow = '';
}

if ('serviceWorker' in navigator) { navigator.serviceWorker.register('./sw.js'); }
